appId: com.antriksh.typingmaster
productName: Antriksh Typing Master
copyright: Copyright © 2024 Antriksh

compression: maximum
electronLanguages: ["en-US"]
electronDist: node_modules/electron/dist
asar: true

buildDependenciesFromSource: false
nodeGypRebuild: false

directories:
  output: release

extraMetadata:
  main: electron.js

files:
  - "dist/**/*"
  - "electron.js"
  - "package.json"
  - "assets/**/*"
  - "!**/*.map"
  - "!**/*.log"
  - "!**/*.md"
  - "!**/*.txt"
  - "!src/**"
  - "!scripts/**"
  - "!public/**"
  - "!node_modules/**"
  - "!**/.git/**"
  - "!**/.github/**"
  - "!**/release/**"
  - "!**/.expo/**"

asarUnpack:
  - "assets/icon.ico"
  - "assets/icon.png"

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "AntrikshTypingMaster-Setup-${version}-win.${ext}"

nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Antriksh Typing Master
  deleteAppDataOnUninstall: true
  runAfterFinish: true

portable:
  artifactName: "AntrikshTypingMaster-${version}-portable.${ext}"
